apply plugin: 'com.android.library'

repositories {
    mavenCentral()
}

android {
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    namespace 'com.alamkanak.weekview'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
