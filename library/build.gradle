apply plugin: 'com.android.library'

repositories {
    mavenCentral()
}

android {
    compileSdk 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.alamkanak.weekview'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
